  <div class="big"><button class="btn no" onclick="ans('${f.k}','no')">❌ ${g?'Não veio':'Falta ou está errado'}</button>${f.na?`<button class="btn na" onclick="ans('${f.k}','na')">➖ Não se aplica</button>`:''}</div></div>`;
  else if(!st.no.length)h+=(!g&&st.wait.length?`<div class="note">✅ Itens padrão conferidos. Falta conferir os pontos adicionais na próxima etapa.</div>`:`<div class="good"><b>🎉 Tudo conferido!</b> ${g?'Pode gerar o Recibo Guichê.':'Pode gerar o '+SA[md].rc+'.'}</div>`);

  h+=`<details style="margin-top:14px"><summary class="hint" style="cursor:pointer">Ver todos os itens</summary><div class="card">${st.L.map(i=>{const a=i.auto||st.M[i.k];return`<div class="item"><div>${E(i.q)}</div><span class="pill ${a==='ok'?'p-ok':a==='no'?'p-no':'p-wait'}" ${auto(i)?'':`onclick="ans('${i.k}',${a?'null':"'ok'"})"`}>${a==='ok'?'✅':a==='no'?'❌':a==='na'?'➖':'⏳'}</span></div>`}).join('')}</div></details>`;

// ---- pontos de verificação adicionados pelo usuário (retaguarda e farmácia; não vale para o guichê)
// Duas camadas: (1) COMPARTILHADOS, gravados dentro do próprio HTML (<script id="cx-shared">), visíveis a todos que abrirem o arquivo publicado;
// (2) LOCAIS, gravados só neste navegador até serem publicados ("Baixar HTML atualizado" e substituir o arquivo no servidor).
const CXG='Pontos adicionais (adicionados pelo usuário)',CXK='ceaf_pontos_extras_v1';
const SH=(()=>{try{const o=JSON.parse(document.getElementById('cx-shared').textContent);return{u:o.u||[],r:o.r||[]}}catch(e){return{u:[],r:[]}}})();
let CX=(()=>{try{const o=JSON.parse(localStorage.getItem(CXK)||'null');if(o&&o.u&&o.r)return{u:o.u,r:o.r,del:o.del||[]}}catch(e){}return{u:[],r:[],del:[]}})();
// limpa o que já foi publicado (igual ao que está no HTML) e exclusões de itens que não existem mais
function cxClean(){['u','r'].forEach(m=>{CX[m]=CX[m].filter(x=>!SH[m].some(y=>y.id===x.id&&y.t===x.t&&y.s===x.s))});const ids=new Set(SH.u.concat(SH.r).map(x=>x.id));CX.del=CX.del.filter(i=>ids.has(i))}
cxClean();
const cxSave=()=>{cxClean();try{localStorage.setItem(CXK,JSON.stringify(CX))}catch(e){}};
const cxEsc=t=>String(t||'').replace(/\s+/g,' ').trim();
// lista efetiva: compartilhados (menos excluídos e menos os alterados localmente) + locais
function cxEff(md){const loc=CX[md],lid=new Set(loc.map(x=>x.id));return SH[md].filter(x=>!CX.del.includes(x.id)&&!lid.has(x.id)).concat(loc)}
const cxPend=()=>CX.u.length+CX.r.length+CX.del.length;
const cxShOnly=(md,id)=>SH[md].some(x=>x.id===id)&&!CX[md].some(x=>x.id===id);
// pontos que valem para o atendimento atual: escopo "*" (todas as doenças) ou doença de algum tratamento
function cxAll(md){if(md!=='u'&&md!=='r')return[];const ds=new Set(S.t.map(t=>dk(t.doenca)).filter(Boolean));return cxEff(md).filter(x=>x.s==='*'||ds.has(x.s))}
const cxItems=md=>cxAll(md).map(x=>({k:'x:'+x.id,g:CXG,q:x.t,na:true,cu:1,s:x.t}));
let cxScope='*';
function cxAdd(){const md=S.mode,el=document.getElementById('cxt'),t=cxEsc(el&&el.value);if(!t){alert('Escreva o ponto de verificação.');return}
  const sc=document.getElementById('cxs').value;cxScope=sc;
  if(cxEff(md).some(x=>x.s===sc&&x.t.toLowerCase()===t.toLowerCase())){alert('Esse ponto já foi adicionado para esse escopo.');return}
  CX[md].push({id:uid(),t,s:sc});cxSave();R()}
function cxEdit(id){const md=S.mode,x=cxEff(md).find(o=>o.id===id);if(!x)return;const t=cxEsc(prompt('Alterar o ponto de verificação:',x.t));if(!t)return;
  const l=CX[md].find(o=>o.id===id);if(l)l.t=t;else CX[md].push({id:x.id,t,s:x.s});cxSave();R()}
function cxDel(id){const md=S.mode,x=cxEff(md).find(o=>o.id===id);if(!x||!confirm('Excluir este ponto de verificação? Ele deixará de aparecer nas próximas conferências.\n\n'+x.t))return;
  CX[md]=CX[md].filter(o=>o.id!==id);if(SH[md].some(o=>o.id===id)&&!CX.del.includes(id))CX.del.push(id);delete S[md]['x:'+id];cxSave();R()}
// gera uma cópia deste HTML com os pontos atuais gravados como compartilhados (para substituir o arquivo no servidor)
function cxExport(){
  const d=document.documentElement.cloneNode(true);
  ['app','steps','foot','print'].forEach(id=>{const e=d.querySelector('#'+id);if(e)e.innerHTML=''});
  const e=d.querySelector('#cx-shared');if(!e){alert('Não encontrei o bloco de dados compartilhados neste HTML.');return}
  e.textContent=JSON.stringify({u:cxEff('u'),r:cxEff('r')}).replace(/</g,'\\u003c');
  const b=new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='Conferência CEAF – UAI Praça Sete.html';document.body.appendChild(a);a.click();a.remove();
  alert('HTML atualizado gerado. Substitua o arquivo no servidor de hospedagem por ele: a partir daí, todos os usuários verão estes pontos.')}

  app.innerHTML=h;
  foot.innerHTML=`<button class="btn ghost" style="flex:.4" onclick="go(2)">⬅️</button><button class="btn" onclick="go(4)">Gerar o ${I.rc} 🖨️</button>`;

const SM={

 'g:rtermo':'Termo de Adesão: precisa estar assinado pelo paciente ou pelo responsável.',
 'g:ra12':'Formulário dos remédios já usados: escreva todos os remédios que o paciente usa ou usou nos últimos 6 meses.',

const low=s=>String(s||'').replace(/\.$/,'').replace(/^(.)(.?)/,(m,a,b)=>/[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(b)?m:a.toLowerCase()+b);
const tail=q=>{q=String(q||'');const x=q.indexOf(': ');return x<0?q:q.slice(x+2)};
const suave=t=>String(t||'')
 .replace(/\(validade (?:máxima )?de ([^)]+)\)/gi,'(vale por até $1)')
 .replace(/validade (?:máxima )?de ([^,;.)]+)/gi,'vale por até $1')
 .replace(/prorrogável até/gi,'aceito até')
 .replace(/dispensações/gi,'retiradas').replace(/dispensação/gi,'retirada')
 .replace(/em todo atendimento/gi,'em toda retirada do remédio')
 .replace(/posologia/gi,'modo de usar')
 .replace(/semestrais|semestral/gi,'a cada 6 meses').replace(/anuais|anual/gi,'uma vez por ano')
 .replace(/\bDCB\b/g,'nome genérico').replace(/\s+/g,' ').trim();
const fim=s=>/[.!?]$/.test(s)?s:s+'.';
function simpOf(i,md){
  const RB=md==='r',k=i.k,q=String(i.q||'');
  if(i.ps)return 'Não encontramos no processo: '+low(simpOf(i.ps,'g'))+'.';
  if(SM[k])return SM[k];
  const sk=k.replace(/^t\d+:/,'');
  if(/^au\d/.test(sk))return 'O remédio '+q.split(': ')[0]+' não combina com o CID do pedido. Peça ao médico para conferir.';
  if(/^ai\d/.test(sk))return 'A idade do paciente não atende à regra do remédio ('+low(tail(q).replace(/^.*regra:\s*/,''))+').';
  if(sk==='lmeA')return 'LME (laudo do médico): o médico precisa corrigir os campos principais (nome do paciente, remédio, quantidade por mês, CID, nome do médico e assinatura com carimbo), sem rasuras.';
  if(sk==='lmeB')return 'LME (laudo do médico): precisa ter sido feita há no máximo 90 dias. Peça uma nova ao médico.';
  if(sk==='lmeC')return 'LME (laudo do médico): faltam informações que o médico deve preencher (nome da mãe, peso, altura, histórico da doença e outras).';
  if(sk==='lmeD')return 'LME (laudo do médico): só pode ter até 6 remédios para o mesmo CID. Peça ao médico uma LME separada.';
  if(sk==='lmeE')return 'LME (laudo do médico): o paciente ou o responsável precisa preencher e assinar a parte final (campos 18 a 23).';
  if(sk==='lme')return 'LME (laudo do médico) preenchida pelo médico.';
  if(sk==='sx')return 'A doença do pedido não combina com o sexo cadastrado do paciente. Peça ao médico para conferir.';
  if(sk==='cid')return 'O CID da LME precisa ser o mesmo CID do pedido.';
  if(sk==='recB')return 'Receita: precisa ser a original, sem rasuras, com nome completo, remédio, dose e quantidade certos, dentro do prazo e com assinatura e carimbo do médico.';
  if(sk==='rec')return 'Receita médica original do tratamento.';
  if(/^f\d/.test(sk)){const n=(q.match(/“(.+?)”/)||[])[1]||'do tratamento';return RB?'Formulário “'+n+'”: o médico precisa preencher, assinar e carimbar.':'Formulário “'+n+'” preenchido pelo médico.'}
  if(/^x\d/.test(sk))return 'Exame: '+fim(suave(tail(q)))+(RB?' Confira se está dentro da validade.':'');
  if(/^q/.test(sk))return (/^Documento/i.test(q)?'Documento: ':'Exame: ')+fim(suave(tail(q)));
  if(/^s/.test(sk))return fim(suave(tail(q)));
  if(sk==='form')return 'Formulário ou relatório extra da doença, preenchido e assinado pelo médico (se for pedido).';
  if(sk==='hcgd'||/^hcg\d/.test(sk))return 'Exame Beta-HCG (teste de gravidez no sangue) para mulheres de 10 a 49 anos, feito há no máximo 15 dias.';
  if(/^age/.test(sk))return 'A idade do paciente precisa seguir a regra do remédio ('+low(q.replace(/^.*\((.+)\)$/,'$1'))+').';
  if(/^ctl/.test(sk)){const m=(q.match(/^Controle especial \((.*?)\)/)||[])[1]||'';return 'Remédio de controle especial ('+m+'): para abrir o processo basta a receita comum. A receita especial é pedida a cada retirada.'}
  if(/^tcr/.test(sk)){const m=q.replace(/^Termo de Conhecimento de Risco de /,'').replace(/ (assinado pelo paciente e pelo médico|apresentado)$/,'');return 'Termo de Conhecimento de Risco do remédio '+m+': assinado pelo paciente e pelo médico.'}
  return fim(suave(q));
}

const grupoTxt=i=>{const g=i.og||i.g;return /^(Documentos|Complementação|Reavaliação)/.test(g)?'DOCUMENTOS DO PACIENTE':'TRATAMENTO: '+g.split(' • ')[0].toUpperCase()};
function listG(){return stat('g').no.map(i=>({g:grupoTxt(i),s:i.s}))}
function buildTxt(L){
  const p=S.p,n1=(p.nome||'').trim().split(/\s+/)[0]||'',pn=n1?n1[0].toUpperCase()+n1.slice(1).toLowerCase():'',oi='Olá'+(pn?', '+pn:'')+'!';
  if(!L.length)return oi+'\nSeu pedido de remédio (protocolo '+p.prot+') foi conferido e não tem nenhuma pendência.\nAgora é só esperar a resposta. Veja pelo MGapp, pelo site cidadao.mg.gov.br ou ligue 155 (LigMinas).';
  const G=new Map();L.forEach(x=>{if(!G.has(x.g))G.set(x.g,[]);G.get(x.g).push(x.s)});
  let n=0,t=oi+'\nSeu pedido de remédio (protocolo '+p.prot+') ainda não pode seguir porque faltam algumas coisas. Veja o que fazer:\n';
  G.forEach((a,g)=>{t+='\n'+g+'\n';a.forEach(s=>{t+=(++n)+') '+s+'\n'})});
  return t+'\nLeve o que falta à UAI '+(p.uai||'')+'. Dúvidas: ligue 155 (LigMinas) ou veja no MGapp.';
}
function copiar(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('Texto copiado!'),()=>prompt('Copie:',t)):prompt('Copie:',t)}
function copiaP(){copiar(buildTxt(listG()))}

// ---------------- PÁGINA 2 – TERMO DE ADESÃO (aba "Termo Adesão") ----------------
function pgTermo(){
  const p=S.p,tipo=TREQ[p.tipo]||'';
  return `<div class="sheet tm"><div class="tlg"><img src="${IMG.tm}" alt=""></div>
  <div class="ttt">TERMO DE ADESÃO PARA SOLICITAÇÃO DE MEDICAMENTOS DO CEAF</div>
  <div class="tst">Esse documento tem por objetivo registrar a entrega dos documentos para a solicitação de medicamentos e traz algumas informações úteis ao paciente</div>
  <div class="tcols"><div>
   <h4>O que esse documento indica?</h4><p>Que seu pedido por um medicamento do Componente Especializado da Assistência Farmacêutica foi registrado.</p>
   <h4>Quais são os próximos passos?</h4><p>Seus documentos serão analisados pela equipe de analistas da Secretaria de Saúde de Minas Gerais com base no definido em regras estaduais e federais (Protocolos Clínicos e Diretrizes Terapêuticas do Ministério da Saúde, Portarias e Resoluções Estaduais).</p>
   <p>Após isso, um documento será produzido com a resposta ao seu pedido, que poderá ser:</p>
   <ul><li>DEFERIDO: não existiam erros no seu pedido e por isso ele foi aceito. Será possível iniciar o tratamento, desde que tenha disponibilidade do medicamento na farmácia.</li>
   <li>DEVOLVIDO: faltam exames, documentos ou informações no seu pedido e por isso ele precisa ser completado. É preciso que os documentos faltantes sejam entregues em até 180 dias.</li>
   <li>INDEFERIDO: seu pedido não obedece às regras estaduais e federais para conseguir o medicamento. Veja o motivo do indeferimento na resposta e leve o documento ao médico. Em caso de reavaliação, é preciso que os documentos faltantes sejam entregues em até 180 dias.</li></ul>
   <h4>Como saber o resultado do meu pedido?</h4><p>Você pode descobrir o resultado pelo MG APP. Para isso, faça o cadastro no aplicativo, acesse o menu, em seguida vá em “Saúde”, depois “Consulta do Andamento da Solicitação de Medicamentos”. Então insira seus dados e selecione o medicamento que gostaria de consultar.</p>
   <h4>E em caso de dúvidas?</h4><p>Em caso de dúvidas, acesse a página www.saude.mg.gov.br/obtermedicamentosceaf.</p>
  </div><div>
   <h4>Se o pedido for DEFERIDO, o que mais preciso saber?</h4>
   <ul><li>A cada 180 dias (6 meses) é necessário entregar novo Laudo para Solicitação, Avaliação e Autorização de medicamentos (LME) e nova receita médica para garantir a continuidade do tratamento;</li>
   <li>Caso o pedido pelo medicamento precise de reavaliação periódica, é necessário entregar novas documentações (LME, receita médica e outros documentos) à farmácia, de tempos em tempos, para continuidade do tratamento. Caso os novos documentos não sejam entregues, o fornecimento do medicamento poderá ser interrompido;</li>
   <li>Para medicamentos sujeitos a controle especial, será necessário entregar nova receita médica mensalmente;</li>
   <li>Caso o medicamento não seja retirado por 6 meses contínuos, sem uma explicação médica anterior a paralisação, será considerado que houve interrupção ou abandono de tratamento e o pedido será INATIVADO. Nesses casos, para conseguir novamente o medicamento, o paciente deverá fazer um novo pedido;</li>
   <li>Caso o tratamento precise ser paralisado por questões médicas, é necessário entregar relatório médico com o motivo da suspensão antes da próxima data de retirada do medicamento. Além disso, quando for necessário reiniciar o tratamento, será preciso entregar nova LME e receita médica;</li>
   <li>Caso o paciente não possa comparecer à farmácia para retirar o medicamento, deverá indicar os representantes por meio da Declaração Autorizadora.</li></ul>
  </div></div>
  <div class="tft">Todos os documentos relativos às solicitações de medicamento(s), uma vez feito o pedido, passam a pertencer à Secretaria Estadual de Saúde. Caso necessário, o usuário/representante poderá solicitar cópias deles.</div>
  <table class="tmd"><colgroup><col style="width:25.7%"><col style="width:37.7%"><col style="width:36.6%"></colgroup>
   <tr><td class="pc b">NOME CIVIL DO PACIENTE:</td><td colspan=2 class="pe b">${E(p.nome)}</td></tr>
   <tr><td class="pc b">NOME SOCIAL DO PACIENTE:</td><td colspan=2 class="pe">${E(p.social)}</td></tr>
   ${tipo?`<tr><td colspan=3 class="ct" style="font-size:11pt">Tipo de reavaliação: <b>${tipo}</b></td></tr>`:''}
   <tr><td class="l8">DATA DO PROTOCOLO:</td><td class="l8">CPF:</td><td class="l8">Nº PROTOCOLO UAI</td></tr>
   <tr><td class="pe ct">${hoje8()}</td><td class="pe ct" style="font-size:11pt">${E(fcpf(p.cpf))}</td><td rowspan=2 class="pe ct b" style="font-size:18pt">${E(p.prot)}</td></tr>
   <tr><td style="font-size:10pt">&nbsp;Nome do atendente:</td><td class="pe ct">${E((p.atend||'').toUpperCase())}</td></tr>
   <tr><td colspan=2 class="ct nb2" style="padding-top:9px">______________________________________________________</td><td class="l8 nb2">LOCAL DE ENTREGA DO(S) DOCUMENTO(S):</td></tr>
   <tr><td colspan=2 class="ct b nb2">ASSINATURA DO(A) ATENDENTE</td><td class="ct b nb2">UAI ${E(p.uai).toUpperCase()}</td></tr>
   <tr><td colspan=3 class="ye">Informações :  acessar o aplicativo MGapp, o site cidadao.mg.gov.br ou LigMinas 155</td></tr>
  </table></div>`;
}

// ---------------- PÁGINA 3 – CHECKLIST DO GUICHÊ ----------------
function stTxt(i,M){const a=i.auto||M[i.k];return a==='ok'?(i.auto?'☑ Conferido':'☑ Apresentado'):a==='na'?'— Não se aplica':a==='no'?(i.auto?'☒ Divergente':'☒ Não apresentado'):'☐ A conferir'}
function pgChk(){
  const p=S.p,st=stat('g');let g='',rows='';
  const sub=(i,a,n)=>a==='na'||!lk(i).length?'':lk(i).map((x,j)=>`<tr class="vr"><td colspan=${n}>${st.M[i.k+'#'+j]?'☑':'☐'} ${E(x)}</td></tr>`).join('');
  st.L.forEach(i=>{if(i.g!==g){g=i.g;rows+=`<tr><td colspan=2 class="gh">${E(g)}</td></tr>`}const a=i.auto||st.M[i.k];rows+=`<tr><td>${E(i.q)}</td><td class="stc ${a==='no'?'sno':''}">${stTxt(i,st.M)}</td></tr>`+sub(i,a,2)});
  return `<div class="sheet ck">${plogo()}<h3>CHECKLIST DO GUICHÊ</h3><div class="sub">Documentos, formulários e conferências feitos no atendimento</div>${cab()}<table class="ckt">${rows}</table>
  <div class="lgd">☑ apresentado/conferido (e, nas linhas recuadas, cada verificação marcada) &nbsp; ☒ pendente &nbsp; — não se aplica &nbsp; ☐ ainda não conferido. A conferência do preenchimento e das regras de fornecimento é feita na Farmácia - Conferência.</div>
  <div class="sig">ASSINATURA DO(A) ATENDENTE — ${E(p.atend)}</div></div>`;
}

}

// ---------------- RETAGUARDA – página 1: checklist específico ----------------
function pgSAChk(md){
  const p=S.p,st=stat(md),I=SA[md],a0=idade();let g='',rows='';
  const m=(a,x)=>a===x?'☑':'☐';
  const sub=(i,a,n)=>a==='na'||!lk(i).length?'':lk(i).map((x,j)=>`<tr class="vr"><td colspan=${n}>${st.M[i.k+'#'+j]?'☑':'☐'} ${E(x)}</td></tr>`).join('');
  st.L.forEach(i=>{if(i.g!==g){g=i.g;rows+=`<tr class="${i.cu?'cu':''}"><td colspan=4 class="gh">${i.cu?'★ ':''}${E(g)}</td></tr>`}const a=i.auto||st.M[i.k];rows+=`<tr class="${i.cu?'cu':''}"><td>${i.cu?'★ ':''}${E(i.q)}</td><td class="mk">${m(a,'ok')}</td><td class="mk ${a==='no'?'sno':''}">${m(a,'no')}</td><td class="mk">${m(a,'na')}</td></tr>`+sub(i,a,4)});
  const pend=st.no.length,wait=st.wait.length;
  return `<div class="sheet ck rk">${plogo()}<h3>${I.ck}</h3><div class="sub">${I.sub}</div>
  <table class="cb"><tr><td>DATA DA CONFERÊNCIA: <b>${fdata(iso)}</b> • TIPO: <b>${E(p.tipo)}</b></td><td>NASCIMENTO: <b>${fdata(p.nasc)}</b>${a0!==null?' ('+fmtIdade(a0)+')':''} • SEXO: <b>${p.sexo==='F'?'Feminino':'Masculino'}</b></td></tr><tr><td colspan=2>TRATAMENTOS: ${trat()}</td></tr></table>
  <table class="ckt"><tr class="th"><td>Item conferido</td><td class="mk">Conforme</td><td class="mk">Pendente</td><td class="mk">N/A</td></tr>${rows}</table>
  <div class="lgd">Resultado: <b>${pend?pend+' pendência(s)':'sem pendências'}</b>${wait?' • '+wait+' item(ns) ainda sem conferir':''}.</div>
  ${st.L.some(i=>i.cu)?'<div class="lgd cu">★ Itens em destaque (fundo amarelo) foram adicionados pelo usuário e não fazem parte do checklist padrão do sistema.</div>':''}<div class="lgd">Formulários específicos e checklists oficiais por doença: ${LINK}</div>

function Pcapa(){
  const bl=bloqueiosCapa();
  if(bl.length){app.innerHTML=`<h1>✋ Falta preencher antes da Capa guichê</h1>${bl.map(b=>`<div class="warn">${E(b.m)} <button class="btn sm" onclick="go(${b.s})">Ir lá</button></div>`).join('')}`;foot.innerHTML=`<button class="btn" onclick="go(${bl[0].s})">Resolver agora</button>`;return}
  const pk=pgReq()+pgTermo()+pgChk();
  app.innerHTML=`<h1>🖨️ Capa guichê</h1><div class="hint">Impressão com 3 páginas: Requerimento, Termo de Adesão e Checklist do guichê (listagem dos itens conferidos, com o status de cada um na hora da impressão). O Recibo Guichê completo, com a lista de pendências, sai na última etapa.</div>${pk}`;
  document.getElementById('print').innerHTML=pk;
  foot.innerHTML=`<button class="btn ghost" style="flex:.4" onclick="go(1)">⬅️</button><button class="btn ghost" style="flex:.7" onclick="print()">🖨️ Imprimir</button><button class="btn" onclick="go(3)">Conferir ✅</button>`;
}
function P3(){
  const st=stat('g'),bl=bloqueios(),p=S.p,P=pendsG();
  if(bl.length){
    app.innerHTML=`<h1>🔒 Recibo Guichê ainda não pode ser emitido</h1><div class="warn">${bl.some(b=>b.loc)?'<b>🛑 Não recolher a documentação na UAI.</b> Encaminhar o paciente conforme o item 1.2 do Manual.':'Faltam dados do paciente para preencher o Requerimento.'}</div>${bl.map(b=>`<div class="item"><span>${E(b.m)}</span><button class="btn sm" onclick="go(${b.s})">Ir lá</button></div>`).join('')}`;
    document.getElementById('print').innerHTML='';
    foot.innerHTML=`<button class="btn ghost" style="flex:.4" onclick="go(3)">⬅️</button><button class="btn" onclick="go(${bl[0].s})">Resolver agora</button>`;return}
  const pk=[pgReq(),pgTermo(),pgChk()];if(P.length)pk.push(pgPend());if(S.decl.on)pk.push(pgDecl());
  const nomes=['Requerimento','Termo de Adesão','Checklist do guichê'].concat(P.length?['Lista de pendências']:[],S.decl.on?['Declaração Autorizadora']:[]);
  const cbx='style="width:26px;height:26px;padding:0;flex:none"',lb='style="display:flex;gap:10px;align-items:center;margin:8px 0"';
  app.innerHTML=`<h1>🧾 Recibo Guichê</h1>`+
